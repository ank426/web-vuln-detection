[project]
name = "web-attack-detector"
version = "0.1.0"
description = "Hybrid transformer + rule-based web attack detection (XSS / CSRF / SQLi)"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "MIT" }

dependencies = [
    "torch>=2.2",
    "transformers>=4.40",
    "beautifulsoup4>=4.12",
    "scikit-learn>=1.4",
    "pandas>=2.2",
    "numpy>=1.26",
]

[project.optional-dependencies]
web = ["streamlit>=1.30", "plotly>=5.20"]
uniembed = [
    "gensim>=4.3",
    # tensorflow_hub 0.16.1 (the latest release) still imports pkg_resources,
    # which setuptools dropped in 81. Keep a compatible version alongside it.
    "setuptools<81",
    "tensorflow-hub>=0.16",
    "tensorflow-cpu>=2.16; sys_platform != 'darwin'",
]

[project.scripts]
web-attack-detector-train = "web_attack_detector.cli.train:main"
web-attack-detector-predict = "web_attack_detector.cli.predict:main"
web-attack-detector-predict-uniembed = "web_attack_detector.cli.predict_uniembed:main"
web-attack-detector-build-dataset = "web_attack_detector.cli.build_dataset:main"
web-attack-detector-web = "web_attack_detector.cli.web:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/web_attack_detector"]

[dependency-groups]
dev = [
    "ruff>=0.6",
    "ty>=0.0.1a1",
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[tool.ruff]
line-length = 100
# Notebooks are research artefacts, not maintained source; linting them produces
# noise about deliberate magic numbers and undefined display names.
extend-exclude = ["notebooks"]
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "C4",   # comprehensions
    "SIM",  # simplify
    "RET",  # return
    "ARG",  # unused arguments
    "PTH",  # use pathlib
    "ANN",  # flake8-annotations
    "D",    # pydocstyle
    "RUF",  # ruff-specific
]
ignore = [
    "D203",  # incompatible with D211
    "D213",  # incompatible with D212
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D100", "D103", "ANN001", "ANN201"]
"notebooks/**" = ["E402", "F811", "ANN"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ty.src]
include = ["src", "tests"]

[tool.ty.environment]
python-version = "3.12"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
filterwarnings = [
    "ignore::DeprecationWarning",
    # Payload corpora are deliberately hostile to html.parser.
    "ignore::bs4.MarkupResemblesLocatorWarning",
]
